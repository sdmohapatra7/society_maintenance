<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - SocietyPro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #f8fafc; display: flex; align-items: center; min-height: 100vh; }
        .reset-card { max-width: 450px; margin: auto; padding: 2.5rem; background: white; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.05); }
        .brand-logo { font-size: 1.5rem; font-weight: 800; color: #1e293b; margin-bottom: 2rem; display: flex; align-items: center; gap: 10px; }
        .brand-logo i { color: #4f46e5; }
        .btn-primary { background: #4f46e5; border: none; padding: 0.8rem; border-radius: 12px; font-weight: 700; }
        .form-control { padding: 0.8rem; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="reset-card">
        <div class="brand-logo">
            <i class="fas fa-building-shield"></i> SocietyPro
        </div>
        <h4 class="fw-bold">Secure Your Account</h4>
        <p class="text-muted small mb-4">Please choose a strong new password below.</p>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-danger small py-2 rounded-3 mb-4">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="mb-3">
                <label class="form-label small fw-bold">New Password</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label small fw-bold">Confirm New Password</label>
                <input type="password" name="confirm_password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 mb-3">Update Password</button>
        </form>
    </div>
</body>
</html>
